name: Publish to PyPI

# Runs when a release tag (e.g. 0.1.27) is pushed; see RELEASING.md.
# Publishing uses PyPI Trusted Publishing: no API token is stored anywhere.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install build tools and package
      run: |
        python -m pip install --upgrade pip
        pip install build twine pytest
        pip install .

    - name: Test
      run: pytest

    - name: Build
      run: python -m build

    - name: Check tag matches package version
      run: |
        test -f "dist/pydcache-${GITHUB_REF_NAME}.tar.gz" || {
          echo "Tag ${GITHUB_REF_NAME} does not match the version in" \
               "pydcache/__init__.py:"; ls dist; exit 1; }

    - name: Check distributions
      run: twine check --strict dist/*

    - name: Store distributions
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pydcache/
    permissions:
      id-token: write  # required for Trusted Publishing

    steps:
    - name: Fetch distributions
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
