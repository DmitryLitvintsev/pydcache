[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydcache"
# version is read from pydcache/__init__.py (see [tool.setuptools.dynamic])
dynamic = ["version"]
description = "Collection of dCache Python utilities"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.8"
authors = [
    { name = "Dmitry Litvintsev", email = "litvinse@fnal.gov" },
]
keywords = ["dcache", "chimera", "tape", "storage", "hep"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: System :: Systems Administration",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "kafka-python>=2.3.1",
    "paramiko>=2.7",
    "psycopg2-binary>=2.8",
    "pyyaml>=5.1",
    "requests>=2.32",
]

[project.optional-dependencies]
kafka = [
    "kafka-python>=2.0",
]
dev = [
    "build>=1.0",
    "twine>=5.0",
    "pytest>=7.0",
    "bump-my-version>=1.0",
]

[project.scripts]
cta-nanny = "pydcache.scripts.cta_nanny:main"
dcache-kill-restores = "pydcache.scripts.dcache_kill_restores:main"
dcache-tape-api = "pydcache.scripts.dcache_tape_api:main"
dcache-ferry = "pydcache.scripts.dcache_ferry:main"
dcache-recover-file = "pydcache.scripts.dcache_recover_file:main"

[project.urls]
Homepage = "https://github.com/DmitryLitvintsev/pydcache"
Issues = "https://github.com/DmitryLitvintsev/pydcache/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pydcache*"]

[tool.setuptools.dynamic]
version = { attr = "pydcache.__version__" }

[tool.setuptools.package-data]
"pydcache" = ["py.typed"]
"pydcache.config" = ["*.yaml", "*.service"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Release: "bump-my-version bump patch|minor|major" updates the version,
# commits and tags; pushing the tag publishes to PyPI (see RELEASING.md).
[tool.bumpversion]
current_version = "0.1.27"
commit = true
tag = true
tag_name = "{new_version}"
tag_message = "pydcache {new_version}"
message = "release {new_version}"

[[tool.bumpversion.files]]
filename = "pydcache/__init__.py"
